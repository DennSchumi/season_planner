name: Build iOS (IPA & TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optionaler iOS Build-Code (leer = aus pubspec.yaml)'
        required: false
        default: ''
      upload_to_testflight:
        description: 'Nach erfolgreichem signierten Build direkt zu TestFlight hochladen'
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    name: iOS Release Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check signing & Firebase configuration
        id: config
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          FIREBASE_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$P12_B64" ] && [ -n "$PROFILE_B64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing-Secrets vorhanden -> signierte IPA wird gebaut."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::IOS_DIST_CERT_P12_BASE64 / IOS_PROVISION_PROFILE_BASE64 fehlen noch -> fuehre unsignierten iOS-Compile-Check aus."
          fi

          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_B64" ]; then
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$FIREBASE_PLIST_B64" ]; then
            echo "$FIREBASE_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist aus GitHub Secret wiederhergestellt."
          elif [ -f ios/Runner/GoogleService-Info.plist ]; then
            echo "GoogleService-Info.plist bereits im Repository vorhanden."
          else
            echo "::warning::GoogleService-Info.plist nicht vorhanden – App baut ohne iOS-FCM-Push."
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update

      - name: Setup Apple Signing Certificate & Provisioning Profile
        if: steps.config.outputs.signed == 'true'
        id: signing
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: temp_build_keychain_pw_${{ github.run_id }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$P12_B64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          # Temporaeren Keychain erstellen und Distribution-Zertifikat importieren
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Provisioning Profile auslesen und installieren
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Profil installiert: $PROFILE_NAME (UUID=$PROFILE_UUID, Team=$TEAM_ID)"

          # ExportOptions.plist dynamisch fuer App Store Distribution erzeugen (ohne fuehrende Leerzeichen vor <?xml)
          python3 - "$RUNNER_TEMP/ExportOptions.plist" "$TEAM_ID" "$PROFILE_NAME" <<'PY'
          import plistlib, sys
          out_path, team_id, profile_name = sys.argv[1], sys.argv[2], sys.argv[3]
          data = {
              "method": "app-store-connect",
              "signingStyle": "manual",
              "teamID": team_id,
              "provisioningProfiles": {
                  "com.tragegurt.seasonplanner": profile_name,
              },
              "signingCertificate": "Apple Distribution",
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
          }
          with open(out_path, "wb") as f:
              plistlib.dump(data, f)
          PY

      - name: Patch Xcode Release Signing Settings for CI
        if: steps.config.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          python3 - <<'PY'
          import os, re
          path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(path, "r", encoding="utf-8") as f:
              txt = f.read()
          team_id = os.environ["TEAM_ID"]
          profile_name = os.environ["PROFILE_NAME"]
          txt = re.sub(r'DEVELOPMENT_TEAM = "[^"]*";', f'DEVELOPMENT_TEAM = {team_id};', txt)
          txt = re.sub(r'"DEVELOPMENT_TEAM\[sdk=iphoneos\*\]" = [^;]+;', f'"DEVELOPMENT_TEAM[sdk=iphoneos*]" = {team_id};', txt)
          txt = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";', f'PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";', txt)
          with open(path, "w", encoding="utf-8") as f:
              f.write(txt)
          PY

      - name: Build signed IPA (App Store / TestFlight)
        if: steps.config.outputs.signed == 'true'
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            EXTRA_ARGS="--build-number=${{ github.event.inputs.build_number }}"
          fi
          flutter build ipa --release $EXTRA_ARGS --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          ls -lh build/ios/ipa/

      - name: Build unsigned iOS app (Compile Check without Apple Secrets)
        if: steps.config.outputs.signed != 'true'
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            EXTRA_ARGS="--build-number=${{ github.event.inputs.build_number }}"
          fi
          flutter build ios --release --no-codesign $EXTRA_ARGS

      - name: Upload signed IPA artifact
        if: steps.config.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: season-planner-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload IPA to TestFlight (App Store Connect)
        if: >-
          steps.config.outputs.signed == 'true' &&
          steps.config.outputs.can_upload == 'true' &&
          (github.event_name == 'push' || inputs.upload_to_testflight == true)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA_FILE=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Uploading $IPA_FILE to App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist_cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys"
