name: Build Android (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optionaler Android versionCode (leer = aus pubspec.yaml)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Android Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter 3.44.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'
          cache: true

      - name: Configure Firebase google-services.json (from Secret if not in repo)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f android/app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "google-services.json aus GitHub Secret wiederhergestellt."
          elif [ -f android/app/google-services.json ]; then
            echo "google-services.json bereits im Repository vorhanden."
          else
            echo "::warning::google-services.json fehlt – Build läuft ohne FCM Push."
          fi

      - name: Configure Android Release Signing (optional via Secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_PASSWORD" \
              "$ANDROID_KEY_ALIAS" > android/key.properties
            echo "Release-Keystore aus GitHub Secrets aktiviert (Play-Store-signiert)."
          else
            echo "::notice::Keine Release-Keystore-Secrets hinterlegt – APK wird mit Debug-Key signiert (ideal für direkte Handy-Tests, noch nicht für Play Store)."
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android Release APK & AAB
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          APPWRITE_FCM_PROVIDER_ID: ${{ secrets.APPWRITE_FCM_PROVIDER_ID }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --build-number=$INPUT_BUILD_NUMBER"
          fi
          if [ -n "$APPWRITE_FCM_PROVIDER_ID" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dart-define=APPWRITE_FCM_PROVIDER_ID=$APPWRITE_FCM_PROVIDER_ID"
          fi
          flutter build apk --release $EXTRA_ARGS
          flutter build appbundle --release $EXTRA_ARGS

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: season-planner-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Android Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: season-planner-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
