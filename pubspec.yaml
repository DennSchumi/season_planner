name: season_planner
description: "Plan your Season"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  appwrite: ^26.2.0
  provider: ^6.1.5
  flutter_launcher_icons: ^0.14.3
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  url_launcher: ^6.3.2
  add_2_calendar_new: ^1.0.4
  universal_html: ^2.2.4
  flutter_markdown_plus: ^1.0.12
  signature: ^6.4.0
  archive: ^4.7.1
  http: ^1.2.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5
  web: ^1.1.0
  pdf: ^3.11.3
  pdfrx: ^2.4.8
  flutter_local_notifications: ^22.3.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.2


flutter_launcher_icons:
  image_path: "lib/assets/app_icon/app_icon.png"
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true


flutter_native_splash:
  color: "#ffffff"
  image: lib/assets/splash_icon/splash_icon.png
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: lib/assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/Inter-ExtraBold.ttf
          weight: 800

