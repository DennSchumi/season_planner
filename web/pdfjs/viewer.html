<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes" />
  <title>PDF-Vorschau</title>
  <style>
    :root {
      --bg: #f4f4f2;
      --toolbar-bg: rgba(255, 255, 255, 0.94);
      --toolbar-border: #e5e5e0;
      --ink: #11131a;
      --muted: #6b7280;
      --btn-bg: #f3f3ef;
      --btn-hover: #e7e7e2;
      --accent: #5b3df5;
      --page-shadow: 0 2px 10px rgba(16, 24, 40, 0.10);
    }
    html.dark {
      --bg: #12131a;
      --toolbar-bg: rgba(23, 24, 33, 0.94);
      --toolbar-border: #282b3a;
      --ink: #f3f4f6;
      --muted: #9ca3af;
      --btn-bg: #1f212d;
      --btn-hover: #2a2d3d;
      --accent: #8c78ff;
      --page-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
    }
    .page-info {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
      padding-left: 4px;
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--toolbar-border);
      background: var(--btn-bg);
      color: var(--ink);
      border-radius: 8px;
      height: 30px;
      min-width: 30px;
      padding: 0 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-label {
      font-size: 11.5px;
      min-width: 48px;
      font-variant-numeric: tabular-nums;
    }
    .viewer {
      flex: 1 1 auto;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .page-wrap {
      background: #ffffff;
      border-radius: 6px;
      box-shadow: var(--page-shadow);
      overflow: hidden;
      flex: 0 0 auto;
      margin: 0 auto;
      line-height: 0;
    }
    .page-wrap canvas {
      display: block;
    }
    .status {
      margin: auto;
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      max-width: 320px;
      line-height: 1.45;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 3px solid var(--toolbar-border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="toolbar">
      <div class="page-info" id="pageInfo">PDF wird geladen…</div>
      <div class="zoom-controls">
        <button class="btn" id="zoomOut" title="Verkleinern" aria-label="Verkleinern">−</button>
        <button class="btn btn-label" id="zoomReset" title="An Breite anpassen">100%</button>
        <button class="btn" id="zoomIn" title="Vergrößern" aria-label="Vergrößern">+</button>
      </div>
    </div>
    <div class="viewer" id="viewer">
      <div class="status" id="statusBox">
        <div class="spinner"></div>
        <div>Dokument wird vorbereitet…</div>
      </div>
    </div>
  </div>

  <script src="./pdf.min.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get('dark') === '1') {
        document.documentElement.classList.add('dark');
      }

      const viewerEl = document.getElementById('viewer');
      const pageInfoEl = document.getElementById('pageInfo');
      const zoomOutBtn = document.getElementById('zoomOut');
      const zoomInBtn = document.getElementById('zoomIn');
      const zoomResetBtn = document.getElementById('zoomReset');

      if (!window.pdfjsLib) {
        viewerEl.innerHTML = '<div class="status">PDF-Renderer konnte nicht geladen werden. Bitte über das Symbol oben rechts extern öffnen.</div>';
        pageInfoEl.textContent = 'Fehler';
        return;
      }

      pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';

      let pdfDoc = null;
      let zoomFactor = 1.0; // 1.0 = Fit-to-Width
      let renderSeq = 0;
      let pageObserver = null;
      let visiblePage = 1;

      function updateToolbar() {
        if (!pdfDoc) return;
        pageInfoEl.textContent = 'Seite ' + visiblePage + ' / ' + pdfDoc.numPages;
        zoomResetBtn.textContent = Math.round(zoomFactor * 100) + '%';
        zoomOutBtn.disabled = zoomFactor <= 0.6;
        zoomInBtn.disabled = zoomFactor >= 3.0;
      }

      async function renderAllPages() {
        if (!pdfDoc) return;
        const seq = ++renderSeq;
        if (pageObserver) {
          pageObserver.disconnect();
          pageObserver = null;
        }

        const availWidth = Math.max(240, viewerEl.clientWidth - 20);
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

        viewerEl.innerHTML = '';
        const wrappers = [];

        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
          const wrap = document.createElement('div');
          wrap.className = 'page-wrap';
          wrap.dataset.page = String(pageNum);
          viewerEl.appendChild(wrap);
          wrappers.push(wrap);
        }

        if ('IntersectionObserver' in window) {
          pageObserver = new IntersectionObserver(
            (entries) => {
              let best = null;
              for (const entry of entries) {
                if (!entry.isIntersecting) continue;
                if (!best || entry.intersectionRatio > best.intersectionRatio) {
                  best = entry;
                }
              }
              if (best && best.target.dataset.page) {
                visiblePage = Number(best.target.dataset.page) || 1;
                updateToolbar();
              }
            },
            { root: viewerEl, threshold: [0.15, 0.4, 0.7] }
          );
          wrappers.forEach((w) => pageObserver.observe(w));
        }

        updateToolbar();

        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
          if (seq !== renderSeq) return;
          const page = await pdfDoc.getPage(pageNum);
          if (seq !== renderSeq) return;

          const baseViewport = page.getViewport({ scale: 1.0 });
          const fitScale = availWidth / baseViewport.width;
          const cssScale = fitScale * zoomFactor;
          const viewport = page.getViewport({ scale: cssScale });
          const renderViewport = page.getViewport({ scale: cssScale * dpr });

          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.floor(renderViewport.width));
          canvas.height = Math.max(1, Math.floor(renderViewport.height));
          canvas.style.width = Math.floor(viewport.width) + 'px';
          canvas.style.height = Math.floor(viewport.height) + 'px';

          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          wrappers[pageNum - 1].appendChild(canvas);

          await page.render({
            canvasContext: ctx,
            viewport: renderViewport,
          }).promise;
        }
      }

      async function loadFromSource(source) {
        try {
          const loadingTask = pdfjsLib.getDocument(source);
          pdfDoc = await loadingTask.promise;
          visiblePage = 1;
          await renderAllPages();
        } catch (err) {
          console.error('PDF.js render error:', err);
          pageInfoEl.textContent = 'Vorschau nicht verfügbar';
          viewerEl.innerHTML =
            '<div class="status">Dieses PDF konnte nicht in der Vorschau dargestellt werden.<br><br>Nutze das Symbol oben rechts, um die Datei direkt zu öffnen oder herunterzuladen.</div>';
        }
      }

      zoomOutBtn.addEventListener('click', () => {
        zoomFactor = Math.max(0.6, +(zoomFactor - 0.25).toFixed(2));
        renderAllPages();
      });
      zoomInBtn.addEventListener('click', () => {
        zoomFactor = Math.min(3.0, +(zoomFactor + 0.25).toFixed(2));
        renderAllPages();
      });
      zoomResetBtn.addEventListener('click', () => {
        zoomFactor = 1.0;
        renderAllPages();
      });

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        if (!pdfDoc || zoomFactor !== 1.0) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => renderAllPages(), 160);
      });

      const fileParam = params.get('file');
      if (fileParam) {
        loadFromSource({ url: fileParam });
      } else {
        window.addEventListener('message', (event) => {
          if (event.origin !== window.location.origin) return;
          if (event.data && event.data.type === 'sp-load-pdf' && event.data.data) {
            loadFromSource({ data: new Uint8Array(event.data.data) });
          }
        });
      }
    })();
  </script>
</body>
</html>
